<!doctype html>
<!-- Plantilla de la imagen que aparece al compartir el link (public/og.jpg, 1200x630).
     WhatsApp casi siempre la muestra como miniatura cuadrada de ~100 px, recortando
     el centro: por eso todo va dentro del cuadro central (x 285–915), con letra
     grande y líneas gruesas. El texto chico se vuelve ruido a ese tamaño, y la hora
     y el lugar ya aparecen junto a la imagen (og:description en index.html).
     Si cambian los datos, edita el texto, ábrela en el navegador con el proyecto
     instalado y toma una captura de 1200x630 con el zoom del navegador al 100 %. -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/cormorant-garamond/latin-500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/cormorant-garamond/latin-500-italic.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jost/latin-500.css">
<style>
  body { margin: 0; }
  .lienzo { width: 1200px; height: 630px; box-sizing: border-box; padding: 24px; background: #F4F7FA; color: #1E2F4A; font-family: 'Jost', sans-serif; }
  .marco { height: 100%; box-sizing: border-box; border: 3px solid #B29A62; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .concha { display: block; margin-bottom: 14px; }
  .etiqueta { font-size: 24px; font-weight: 500; letter-spacing: 0.3em; margin-right: -0.3em; text-transform: uppercase; color: #4A6FA5; }
  .nombre { margin-top: 2px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 228px; line-height: 0.95; }
  .apellidos { margin-top: 8px; font-size: 34px; font-weight: 500; letter-spacing: 0.26em; margin-right: -0.26em; text-transform: uppercase; }
  .fecha { display: flex; align-items: center; gap: 20px; margin-top: 26px; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 50px; line-height: 1; letter-spacing: 0.04em; }
  .linea { width: 56px; height: 3px; background: #B29A62; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="marco">
    <svg class="concha" width="88" height="77" viewBox="0 0 64 56" fill="none" stroke="#B29A62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 34 A26 26 0 0 1 58 34 L38 50 H26 Z"/>
      <path d="M32 50 L12 20 M32 50 L22 11 M32 50 L32 8 M32 50 L42 11 M32 50 L52 20"/>
    </svg>
    <div class="etiqueta">Mi bautizo</div>
    <div class="nombre">Álvaro</div>
    <div class="apellidos">Islas Domínguez</div>
    <div class="fecha"><span class="linea"></span><span>24 · Octubre · 2026</span><span class="linea"></span></div>
  </div>
</div>
</body>
</html>
